[project]
name = "proimages"
version = "0.1.0"
description = "AI + physical modeling pipeline that makes phone/action-cam photos look camera-shot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "rawpy>=0.21",
    "torch>=2.2",
    "huggingface_hub>=0.25",
    "colour-science>=0.4.3",
    "scipy>=1.11",
    "openai>=1.40",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
proimages = "proimages.cli:main"
proimages-api = "proimages.api.server_cli:main"
proimages-lut = "proimages.lut_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proimages"]
